<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Configurações, MNEME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/icon-192.png">
<link rel="apple-touch-icon" href="/assets/brand/icon-180.png">
<link rel="manifest" href="/assets/brand/site.webmanifest">
<meta name="theme-color" content="#0a0b0a">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="settings-page">
<a class="skip-link" href="#form">Ir para as configurações</a>
<header class="app-bar">
  <span class="logo"><img src="/assets/brand/mneme-horizontal.png" alt="MNEME" width="116" height="28"></span>
  <nav class="nav" aria-label="Navegação principal"><a href="/">Painel</a><a href="/configuracoes" aria-current="page">Configurações</a></nav>
  <div class="right"><span id="modeBadge"></span></div>
</header>

<main>
<div class="page-heading"><div><h1>Configurações</h1><p>Defina a estratégia e os limites de cada operação.</p></div><a class="back-link" href="/">Voltar ao painel ↗</a></div>
<form class="form-wrap" id="form" novalidate tabindex="-1">
  <div id="sections"></div>
  <div class="savebar">
    <span class="msg" id="msg">Alterações valem para os próximos sinais assim que você salvar.</span>
    <span style="display:flex;gap:8px">
      <button class="btn" type="button" id="defaults">Restaurar padrão</button>
      <button class="btn primary" type="submit" id="save">Salvar</button>
    </span>
  </div>
</form>
</main>
<script src="/assets/common.js"></script>
<script src="/assets/settings.js"></script>
</body>
</html>
