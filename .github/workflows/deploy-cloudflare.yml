name: Deploy MNEME to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "functions/**"
      - "functions/**"
      - "wrangler.jsonc"
      - ".gitattributes"
      - "scripts/prepare-pages.sh"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mneme-cloudflare-pages-hosted
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Aceita o ID da conta como variável ou como secret.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          falta() { echo "::error::$1"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || falta "Defina CLOUDFLARE_ACCOUNT_ID como variável ou secret."
          [ -n "$CLOUDFLARE_API_TOKEN" ] || falta "Defina o secret CLOUDFLARE_API_TOKEN."

      - name: Publish Pages + Worker
        shell: bash
        run: |
          set -euo pipefail
          stage_dir="$(mktemp -d)"
          trap 'rm -rf "$stage_dir"' EXIT
          cp -R public "$stage_dir/public"
          npm exec --yes \
            --package=esbuild@0.28.2 \
            --package=javascript-obfuscator@5.4.2 \
            -- bash scripts/prepare-pages.sh "$stage_dir/public"
          npx --yes wrangler@4.129.0 pages deploy "$stage_dir/public" \
            --project-name mneme \
            --branch main
