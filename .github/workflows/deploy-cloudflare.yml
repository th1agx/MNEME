name: Deploy MNEME to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "functions/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "scripts/prepare-pages.sh"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mneme-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, mneme-cloudflare]
    env:
      MNEME_DEPLOY_CHECKOUT: ${{ vars.MNEME_DEPLOY_CHECKOUT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deployment checkout
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MNEME_DEPLOY_CHECKOUT"
          test -d "$MNEME_DEPLOY_CHECKOUT/.git"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          if [ -n "$(git -C "$MNEME_DEPLOY_CHECKOUT" status --porcelain)" ]; then
            echo "Deployment checkout must be clean; refusing to overwrite local changes."
            exit 1
          fi

      - name: Update unlocked checkout
        shell: bash
        run: |
          set -euo pipefail
          git -C "$MNEME_DEPLOY_CHECKOUT" fetch --prune origin main
          git -C "$MNEME_DEPLOY_CHECKOUT" reset --hard FETCH_HEAD

      - name: Apply D1 migrations and publish Pages + Worker
        shell: bash
        run: |
          set -euo pipefail
          cd "$MNEME_DEPLOY_CHECKOUT"
          stage_dir="$(mktemp -d)"
          trap 'rm -rf "$stage_dir"' EXIT
          cp -R public "$stage_dir/public"
          npm exec --yes \
            --package=esbuild@0.28.2 \
            --package=javascript-obfuscator@5.4.2 \
            -- bash scripts/prepare-pages.sh "$stage_dir/public"
          npx --yes wrangler@4.129.0 d1 migrations apply mneme-operational --remote --config wrangler.jsonc
          npx --yes wrangler@4.129.0 pages deploy "$stage_dir/public" \
            --project-name mneme-1b8 \
            --branch main \
            --config wrangler.jsonc
