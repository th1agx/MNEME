name: Deploy MNEME Telegram Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/bot/**"
      - "migrations/**"
      - "wrangler.bot.jsonc"
      - ".gitattributes"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mneme-telegram-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout repository for git-crypt unlock
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check required secrets
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          GIT_CRYPT_KEY_B64: ${{ secrets.GIT_CRYPT_KEY_B64 }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Configure CLOUDFLARE_ACCOUNT_ID as a repository variable or secret."; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Configure CLOUDFLARE_WORKER_API_TOKEN or CLOUDFLARE_API_TOKEN as a repository secret."; exit 1; }
          [ -n "$GIT_CRYPT_KEY_B64" ] || { echo "::error::Configure GIT_CRYPT_KEY_B64 as a repository secret."; exit 1; }

      - name: Install git-crypt
        run: |
          sudo apt-get update
          sudo apt-get install --yes git-crypt

      - name: Unlock selected deployment files
        shell: bash
        env:
          GIT_CRYPT_KEY_B64: ${{ secrets.GIT_CRYPT_KEY_B64 }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/mneme-git-crypt-key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$GIT_CRYPT_KEY_B64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          git-crypt unlock "$key_file"
          test "$(head -c 9 workers/bot/index.ts)" != "GITCRYPT"
          test "$(head -c 9 migrations/0003_bot_runtime.sql)" != "GITCRYPT"
          test "$(head -c 9 migrations/0004_bot_access_and_group.sql)" != "GITCRYPT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.9"

      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.129.0 d1 migrations apply mneme-operational --remote --config wrangler.bot.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.bot.jsonc

      - name: Re-lock the checkout
        if: always()
        shell: bash
        run: |
          if command -v git-crypt >/dev/null 2>&1; then
            git-crypt lock --force || true
          fi
