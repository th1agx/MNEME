><rect class="n5" x="1008" y="84" width="164" height="68" rx="6" fill="#161a1e" stroke="#2b3139" stroke-width="1.5"/><text x="1090" y="113" class="t" font-size="15" font-weight="500" text-anchor="middle">Monitor</text><text x="1090" y="134" class="f" font-size="12" text-anchor="middle">alvo, stop, saída</text><g class="okL"><text x="1090" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#0ecb81">Comprado US$ 25,00</text><text x="1090" y="212" text-anchor="middle" font-size="12" class="m">score 78 · atraso 2,1 s</text></g><g class="noL"><text x="698" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#f6465d">Recusado</text><text x="698" y="212" text-anchor="middle" font-size="12" class="m">chegou 14 s depois do trader (limite 10 s)</text></g>
