<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Caminho de um sinal: provedor, normalização, score, regras, execução e monitor">
<style>text{font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{fill:#eaecef}.m{fill:#848e9c}.f{fill:#5e6673}
