# Serviços do MNEME na Oracle A1. Sem chaves: a coleta usa só dados públicos.
x-servico: &servico
  build: .
  user: "${MNEME_UID:-1001}:${MNEME_GID:-1001}"  # dono da pasta ./dados na A1
  environment:
    MNEME_DADOS_MERCADO: /dados/mercado
  volumes:
    - ./dados:/dados
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  coleta:
    <<: *servico
    command: [".venv/bin/python", "-m", "mneme.dados", "coletar"]
    mem_limit: 600m
    cpus: 0.5
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import datetime as d,pathlib as p; t=d.datetime.fromisoformat(p.Path('/dados/mercado/coleta.batimento').read_text()); raise SystemExit(d.datetime.now(d.timezone.utc)-t>d.timedelta(minutes=3))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Notícias, calendário e, com credencial no .env, o X. Texto externo é só dado.
  inteligencia:
    <<: *servico
    command: [".venv/bin/python", "-m", "mneme.inteligencia", "rodar"]
    mem_limit: 500m
    cpus: 0.5
    cpu_shares: 256
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import datetime as d,pathlib as p; t=d.datetime.fromisoformat(p.Path('/dados/mercado/inteligencia.batimento').read_text()); raise SystemExit(d.datetime.now(d.timezone.utc)-t>d.timedelta(minutes=5))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Grava previsões antes do resultado e não opera. Fica atrás da coleta na disputa por CPU.
  previsor:
    <<: *servico
    command: [".venv/bin/python", "-m", "mneme.previsor", "rodar"]
    environment:
      MNEME_DADOS_MERCADO: /dados/mercado
      MNEME_MODELOS: /dados/modelos
    mem_limit: 1500m
    cpus: 1
    cpu_shares: 256
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import datetime as d,pathlib as p; t=d.datetime.fromisoformat(p.Path('/dados/mercado/previsor.batimento').read_text()); raise SystemExit(d.datetime.now(d.timezone.utc)-t>d.timedelta(minutes=5))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Carteira virtual por técnica. Não envia ordem: grava o sinal antes do resultado.
  carteira:
    <<: *servico
    command: [".venv/bin/python", "-m", "mneme.carteira_tecnicas", "rodar"]
    mem_limit: 800m
    cpus: 0.75
    cpu_shares: 256
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import datetime as d,pathlib as p; t=d.datetime.fromisoformat(p.Path('/dados/mercado/carteira.batimento').read_text()); raise SystemExit(d.datetime.now(d.timezone.utc)-t>d.timedelta(minutes=5))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s


  # O robô: vela fechada, decisão, risco, sinal, execução simulada e diário. Não envia ordem real.
  motor:
    <<: *servico
    command: [".venv/bin/python", "-m", "mneme.motor", "rodar"]
    mem_limit: 1500m
    cpus: 1
    cpu_shares: 512
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import datetime as d,pathlib as p; t=d.datetime.fromisoformat(p.Path('/dados/mercado/motor.batimento').read_text()); raise SystemExit(0 if (d.datetime.now(d.timezone.utc)-t).total_seconds()<300 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Seguir traders e teste ao vivo dos setups. Único serviço com segredos: lê o .env da raiz (provedor de sinais e Telegram).
  traders:
    <<: *servico
    command: [".venv/bin/python", "-m", "mneme"]
    env_file: ../.env
    environment:
      MNEME_DADOS_MERCADO: /dados/mercado
      MNEME_BANCO: /dados/mneme.db
    mem_limit: 500m
    cpus: 0.5
    cpu_shares: 512
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import datetime as d,pathlib as p; t=d.datetime.fromisoformat(p.Path('/dados/traders.batimento').read_text()); raise SystemExit(d.datetime.now(d.timezone.utc)-t>d.timedelta(minutes=5))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Quadro de evidências (F1, sombra). Não usa o volume comum: lê os dados só para leitura e escreve só em ./dados/quadro.
  # O motor não lê nada daqui. Começa 20 s depois de cada minuto, quando o motor já decidiu.
  # Perfil próprio: só sobe com `docker compose --profile sombra up -d --no-deps quadro`. Parado, fica parado, mesmo depois de reiniciar a A1.
  quadro:
    profiles: ["sombra"]
    build: .
    user: "${MNEME_UID:-1001}:${MNEME_GID:-1001}"
    command: [".venv/bin/python", "-m", "mneme.quadro", "rodar"]
    environment:
      MNEME_DADOS_MERCADO: /dados/mercado
      MNEME_DIARIO: /dados/operacao/diario.db
      MNEME_OPERACAO: /dados/operacao.json
      MNEME_MODELOS: /dados/modelos
      MNEME_MODELOS_MOTOR: /dados/modelos/motor
      MNEME_QUADRO: /quadro
    volumes:
      - ./dados:/dados:ro
      - ./dados/quadro:/quadro
    restart: unless-stopped
    mem_limit: 500m
    cpus: 0.5
    cpu_shares: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import datetime as d,pathlib as p; t=d.datetime.fromisoformat(p.Path('/quadro/quadro.batimento').read_text()); raise SystemExit(0 if (d.datetime.now(d.timezone.utc)-t).total_seconds()<300 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  # A LLM lê as notícias no próprio ritmo e guarda o contexto. Se cair, o motor segue sem perceber.
  leitor:
    <<: *servico
    command: [".venv/bin/python", "-m", "mneme.motor", "ler"]
    mem_limit: 500m
    cpus: 0.25
    cpu_shares: 128
  # IA Generativa local e gratuita. A porta só existe dentro da própria máquina. Perde a disputa por CPU para a coleta.
  llm:
    image: ollama/ollama:0.12.6
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ./dados/ollama:/root/.ollama
    restart: always
    mem_limit: 5g
    cpus: 2
    cpu_shares: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  # Separado das velas: uma falha aqui não interrompe a coleta principal.
  fluxo:
    <<: *servico
    command: [".venv/bin/python", "-m", "mneme.dados", "fluxo"]
    stop_grace_period: 30s
    mem_limit: 600m
    cpus: 0.5
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import datetime as d,pathlib as p; t=d.datetime.fromisoformat(p.Path('/dados/mercado/fluxo/fluxo.batimento').read_text()); raise SystemExit(d.datetime.now(d.timezone.utc)-t>d.timedelta(minutes=3))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
